<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <nav>
        <a href="#section1">Section 1</a>
        <a href="#section2">Section 2</a>
    </nav>
    
    <section id="section1" style="height: 100vh; background: lightblue;">
        Section 1
  </section>

  <section id="section2" style="height: 100vh; background: lightcoral;">
    Section 2
</section>

<script src="https://unpkg.com/@studio-freight/lenis@latest/bundled/lenis.min.js"></script>
<script>
    const lenis = new Lenis({
      duration: 0.1 ,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smooth: true,
    });

    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }
    
    requestAnimationFrame(raf);
    </script>
<script defer src="https://unpkg.com/@studio-freight/lenis@latest/bundled/lenis.min.js"></script>
</body>
</html>
