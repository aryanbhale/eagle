<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scalable Project Page</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  .hidden { display: none; }
  
  .projectPane { padding: 20px; background: #f4f4f4; }
  .project { background: white; padding: 15px; margin-bottom: 10px; border-radius: 6px; }
  
  .projectDetail { padding: 20px; background: #fffbe6; min-height: 100vh; }
  .section { margin-bottom: 20px; }
  .section h3 { margin-bottom: 8px; color: #444; }
  
  button { padding: 8px 14px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #0056b3; }
</style>
</head>
<body>

<div class="projectPane">
  <h2>Projects</h2>
  <div class="project">
    <p>Project 1: Short description...</p>
    <button class="readMoreBtn" data-id="1">Read More</button>
  </div>
  <div class="project">
    <p>Project 2: Short description...</p>
    <button class="readMoreBtn" data-id="2">Read More</button>
  </div>
  <div class="project">
    <p>Project 3: Short description...</p>
    <button class="readMoreBtn" data-id="3">Read More</button>
  </div>
</div>

<!-- Single detail container -->
<div class="projectDetail hidden">
  <h2 id="detailTitle"></h2>
  <div id="detailContent"></div>
  <button class="goBackBtn">Go Back</button>
</div>

<script>
// Centralized project data
const projects = {
  1: {
    title: "Project 1 - AI Research",
    sections: [
      { heading: "Overview", text: "This project explored AI-driven text generation for large datasets." },
      { heading: "Challenges", text: "Data cleaning, bias mitigation, and computational costs." },
      { heading: "Outcome", text: "Successfully deployed an AI model serving 50k+ users." }
    ]
  },
  2: {
    title: "Project 2 - Web App Development",
    sections: [
      { heading: "Overview", text: "Developed a scalable e-commerce platform." },
      { heading: "Tech Stack", text: "React, Node.js, MongoDB, AWS." },
      { heading: "Results", text: "Reduced page load time by 45%, boosted conversions by 30%." }
    ]
  },
  3: {
    title: "Project 3 - Data Visualization",
    sections: [
      { heading: "Overview", text: "Created interactive dashboards for financial analytics." },
      { heading: "Tools Used", text: "D3.js, Chart.js, Power BI." },
      { heading: "Impact", text: "Improved decision-making speed by 70% in client operations." }
    ]
  }
};

const projectPane = document.querySelector('.projectPane');
const projectDetail = document.querySelector('.projectDetail');
const detailTitle = document.getElementById('detailTitle');
const detailContent = document.getElementById('detailContent');
const readMoreButtons = document.querySelectorAll('.readMoreBtn');
const goBackButton = document.querySelector('.goBackBtn');

// Handle Read More clicks
readMoreButtons.forEach(button => {
  button.addEventListener('click', () => {
    const projectId = button.dataset.id;
    const project = projects[projectId];
    
    detailTitle.textContent = project.title;
    detailContent.innerHTML = project.sections
      .map(sec => `
        <div class="section">
          <h3>${sec.heading}</h3>
          <p>${sec.text}</p>
        </div>
      `)
      .join('');
    
    projectPane.classList.add('hidden');
    projectDetail.classList.remove('hidden');
  });
});

// Handle Go Back
goBackButton.addEventListener('click', () => {
  projectDetail.classList.add('hidden');
  projectPane.classList.remove('hidden');
});
</script>

</body>
</html>
